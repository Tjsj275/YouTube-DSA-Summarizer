server.port=8080

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Gemini API Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1/models/gemini-2.5-flash:generateContent

# YouTube Data API Configuration
youtube.api.key=${YOUTUBE_API_KEY}
youtube.data.api.url=https://www.googleapis.com/youtube/v3
youtube.transcript.api.url=https://www.youtube.com/api/timedtext

# Comment Mining Configuration
comment.mining.max.comments=100
comment.mining.max.replies=50
comment.mining.min.comment.length=20
comment.mining.relevance.threshold=0.3

# DSA Keywords for filtering
dsa.keywords=dp,dynamic programming,binary search,greedy,time complexity,space complexity,O(,algorithm,optimized,brute force,edge case,solution,approach,recursion,iteration,backtracking,memoization,tabulation,divide and conquer,sliding window,two pointer,hash map,tree,graph,bfs,dfs,dijkstra,heap,stack,queue,linked list,array,string,complexity analysis

# Chunking Configuration
chunking.min.words=600
chunking.max.words=800

# Logging
logging.level.com.dsa.summarizer=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n